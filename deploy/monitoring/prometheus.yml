global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    stack: n8n

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
        labels:
          instance: prometheus

  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets: ['traefik:8081']
        labels:
          instance: traefik

  - job_name: n8n
    metrics_path: /metrics
    static_configs:
      - targets: ['main:5678']
        labels:
          instance: n8n-main

  # Workers, discovered by DNS so `compose up --scale worker=N` is picked up
  # without editing this file. Deliberately NOT job=n8n: every existing alert
  # rule is scoped to that label, and `n8n Down` (min_over_time(up{job="n8n"}))
  # would fire every time a worker is scaled down.
  - job_name: n8n-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ['worker']
        type: A
        port: 5678
    scrape_interval: 15s

  - job_name: postgres_exporter
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          instance: postgres

  - job_name: redis_exporter
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          instance: redis

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: cadvisor

  - job_name: node_exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: node
